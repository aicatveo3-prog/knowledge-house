<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>새 글 · 지식의 집</title>
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header" data-header></header>

    <main class="wrap wrap-panel">
      <div class="editor-bar">
        <button class="btn btn-sm" id="btn-preview" type="button">미리보기</button>
        <button
          class="btn btn-sm btn-quiet"
          id="btn-tidy"
          type="button"
          title="번호 붙은 소제목을 제목으로 바꾸고 붙여넣기 찌꺼기를 정리합니다"
        >
          정리
        </button>
        <span class="spacer"></span>
        <span class="save-state" id="save-state"></span>
        <button class="btn btn-sm" id="btn-draft" type="button">초안 저장</button>
        <button class="btn btn-sm btn-primary" id="btn-publish" type="button">
          발행
        </button>
      </div>

      <div id="no-token" class="notice hidden">
        <span>글을 저장하려면 GitHub 토큰이 필요합니다.</span>
        <span class="spacer"></span>
        <button class="btn btn-sm" id="btn-open-settings" type="button">
          설정 열기
        </button>
      </div>

      <div id="edit-pane" class="panel">
        <textarea
          class="title-input"
          id="title"
          rows="1"
          placeholder="제목 없음"
          spellcheck="false"
        ></textarea>

        <div class="meta-row">
          <input class="meta-input" id="date" type="date" />
          <input
            class="meta-input folder"
            id="folder"
            type="text"
            list="folder-options"
            placeholder="폴더 (예: 책1)"
            autocomplete="off"
            title="/ 로 나누면 폴더 안에 폴더가 됩니다"
          />
          <datalist id="folder-options"></datalist>
          <input
            class="meta-input tags"
            id="tags"
            type="text"
            placeholder="태그를 쉼표로 구분"
            autocomplete="off"
          />
          <select class="meta-input" id="status">
            <option value="">상태 없음</option>
            <option value="씨앗">씨앗 🌱</option>
            <option value="자라는 중">자라는 중 🌿</option>
            <option value="완성">완성 🌳</option>
          </select>
        </div>

        <textarea
          class="body-input"
          id="body"
          placeholder="여기에 쓰세요.  /  를 누르면 서식 메뉴가 열립니다."
          spellcheck="false"
        ></textarea>

        <p class="editor-hint">
          <kbd>/</kbd> 서식 메뉴 &nbsp;·&nbsp;
          <kbd>Ctrl</kbd>+<kbd>S</kbd> 초안 저장 &nbsp;·&nbsp;
          <kbd>Ctrl</kbd>+<kbd>Enter</kbd> 발행
          <br />
          다른 곳에서 복사한 글은 <strong>제목·굵게·목록·표·가로선이 그대로</strong> 붙습니다.
          번호 붙은 소제목은 <strong>정리</strong> 버튼으로 제목으로 바꿀 수 있습니다.
          이미지도 붙여넣기로 올라갑니다.
        </p>
      </div>

      <article id="preview-pane" class="preview-pane panel hidden">
        <h1 id="preview-title" class="post-header"></h1>
        <div class="prose" id="preview-body"></div>
      </article>
    </main>

    <script src="config.js"></script>
    <script src="js/store.js"></script>
    <script src="js/markdown.js"></script>
    <script src="js/folders.js"></script>
    <script src="js/docs.js"></script>
    <script src="js/html2md.js"></script>
    <script src="js/github.js"></script>
    <script src="js/app.js"></script>
    <script src="js/editor.js"></script>
  </body>
</html>
