<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Nexus — 세상의 모든 지식을 연결하다</title>
  <meta name="description" content="지식을 탐험하고 연결하는 새로운 방법">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
</head>
<body>
  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="#" class="nav-logo" id="nav-logo">
        <span class="nav-logo-mark">N</span>
        <span class="nav-logo-text">Knowledge Nexus</span>
      </a>
      <div class="nav-tabs">
        <button class="nav-tab active" data-mode="home">홈</button>
        <button class="nav-tab" data-mode="explore">탐색</button>
        <button class="nav-tab" data-mode="paths">학습경로</button>
      </div>
      <div class="nav-search">
        <input type="text" id="search-input" placeholder="무엇이 궁금하세요?" autocomplete="off">
        <div id="search-dropdown" class="search-dropdown hidden"></div>
      </div>
    </div>
  </nav>

  <!-- Home View -->
  <main id="view-home" class="view active">
    <section class="hero">
      <div class="hero-content">
        <h1 class="hero-title">세상의 모든 지식을<br><span class="highlight">연결</span>합니다</h1>
        <p class="hero-desc">개념과 개념 사이의 관계를 탐험하며, 나만의 학습 여정을 만들어보세요.</p>
      </div>
    </section>

    <!-- Featured Concept (selected) -->
    <section id="featured-section" class="section">
      <div class="container">
        <div id="concept-detail" class="concept-detail"></div>
      </div>
    </section>

    <!-- Browse by Category -->
    <section class="section section-browse">
      <div class="container">
        <h2 class="section-title">분야별 탐색</h2>
        <p class="section-desc">관심 있는 분야를 선택해 지식의 지도를 펼쳐보세요</p>
        <div id="category-grid" class="category-grid"></div>
      </div>
    </section>

    <!-- All Concepts -->
    <section class="section">
      <div class="container">
        <h2 class="section-title">모든 개념</h2>
        <p class="section-desc">현재 등록된 모든 지식을 한눈에 볼 수 있습니다</p>
        <div id="all-concepts-grid" class="concepts-grid"></div>
      </div>
    </section>
  </main>

  <!-- Explore View (Graph) -->
  <main id="view-explore" class="view">
    <div class="explore-wrapper">
      <div class="explore-header">
        <h2>지식 그래프</h2>
        <p>노드를 클릭해 개념 간의 연결을 탐색하세요</p>
      </div>
      <div id="graph-container" class="graph-container"></div>
      <div id="graph-tooltip" class="graph-tooltip hidden"></div>
    </div>
  </main>

  <!-- Paths View -->
  <main id="view-paths" class="view">
    <div class="container paths-container">
      <div class="paths-header">
        <h2>학습 경로</h2>
        <p>목표를 선택하면 단계별로 최적의 학습 순서를 안내합니다</p>
      </div>
      <div id="paths-content"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer" id="footer">
    <div class="container">
      <p>Knowledge Nexus — 지식의 연결에서 새로운 발견이 시작됩니다</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
