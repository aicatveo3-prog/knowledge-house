<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Nexus — 세상의 모든 지식을 연결하다</title>
  <meta name="description" content="계층적 분류와 그래프 연결로 지식을 탐험하는 플랫폼">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo">N</div>
      <h1 class="site-title">Knowledge <span class="accent">Nexus</span></h1>
    </div>
    <nav class="mode-switcher">
      <button class="mode-btn active" data-mode="structure" title="계층 탐색">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span class="mode-label">구조</span>
      </button>
      <button class="mode-btn" data-mode="explore" title="그래프 탐색">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span class="mode-label">탐험</span>
      </button>
      <button class="mode-btn" data-mode="learn" title="단계별 학습">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
        <span class="mode-label">학습경로</span>
      </button>
    </nav>
    <div class="header-right">
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" placeholder="개념 검색..." autocomplete="off">
        <button id="search-clear" class="search-clear hidden">✕</button>
      </div>
      <div id="search-dropdown" class="search-dropdown hidden"></div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Structure Mode -->
    <div id="view-structure" class="view-panel active">
      <aside id="tree-panel" class="tree-panel">
        <div class="panel-title">
          <span>📂 지식 트리</span>
        </div>
        <div id="tree-container" class="tree-container"></div>
      </aside>
      <section id="document-panel" class="document-panel">
        <div id="concept-document" class="concept-document">
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            <p class="empty-title">개념을 선택해주세요</p>
            <p class="empty-desc">왼쪽 트리에서 개념을 클릭하면 여기에 표시됩니다</p>
          </div>
        </div>
      </section>
      <aside id="mini-graph-panel" class="mini-graph-panel">
        <div class="panel-title">
          <span>🕸️ 연결 그래프</span>
        </div>
        <div id="mini-graph-container" class="graph-container"></div>
      </aside>
    </div>

    <!-- Explore Mode -->
    <div id="view-explore" class="view-panel">
      <div class="explore-legend">
        <div class="legend-group">
          <span class="legend-label">분류:</span>
          <span class="legend-item"><span class="legend-dot" style="background:#3b82f6"></span>컴퓨터과학</span>
        </div>
        <div class="legend-divider"></div>
        <div class="legend-group">
          <span class="legend-label">관계:</span>
          <span class="legend-item"><span class="legend-line" style="background:#f59e0b"></span>필요</span>
          <span class="legend-item"><span class="legend-line" style="background:#ef4444"></span>야기</span>
          <span class="legend-item"><span class="legend-line" style="background:#ec4899"></span>대립</span>
          <span class="legend-item"><span class="legend-line" style="background:#6b7280"></span>관련</span>
          <span class="legend-item"><span class="legend-line" style="background:#10b981"></span>창시</span>
        </div>
      </div>
      <div id="full-graph-container" class="full-graph-container"></div>
      <div id="explore-info" class="explore-info hidden"></div>
      <div id="explore-breadcrumb" class="explore-breadcrumb"></div>
    </div>

    <!-- Learn Mode -->
    <div id="view-learn" class="view-panel">
      <div id="learn-container" class="learn-container"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
