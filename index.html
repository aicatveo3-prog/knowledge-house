<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>지식의 집</title>
    <meta name="description" content="읽고 생각한 것을 쌓아두는 곳" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header" data-header></header>

    <main class="wrap">
      <section class="intro">
        <h1 id="site-title">지식의 집</h1>
        <p id="site-tagline"></p>
      </section>

      <nav class="breadcrumb" id="breadcrumb" aria-label="폴더 위치"></nav>

      <div class="toolbar">
        <input
          type="search"
          class="search"
          id="search"
          placeholder="모든 글에서 검색"
          autocomplete="off"
        />
        <button class="btn btn-sm btn-quiet hidden" id="toggle-drafts" type="button">
          초안 보기
        </button>
        <a class="btn btn-sm btn-primary" href="write.html">글쓰기</a>
      </div>

      <div class="tag-row" id="tag-row"></div>

      <!-- 프롬프트 메모장 -->
      <section class="prompt-pad" id="prompt-pad">
        <button class="prompt-pad-toggle" id="prompt-pad-toggle" type="button">
          <span class="prompt-pad-icon">📋</span>
          <span class="prompt-pad-label">프롬프트 메모장</span>
          <span class="prompt-pad-arrow" id="prompt-pad-arrow">›</span>
        </button>
        <div class="prompt-pad-body hidden" id="prompt-pad-body">
          <div class="prompt-pad-card">
            <h3 class="prompt-pad-title">요약본용</h3>
            <p class="prompt-pad-text">다음 글을 요약본으로 정리해줘. 너가 스스로 글을 쓰진 말고, 글의 내용을 기반으로만 정리해. 원문 흐름대로 항목화하고, 핵심 키워드와 짧은 문장 위주로. 인용문은 그대로 살릴 것.</p>
            <button class="btn btn-sm btn-quiet prompt-pad-copy" type="button" data-copy="요약본">복사</button>
          </div>
          <div class="prompt-pad-card">
            <h3 class="prompt-pad-title">정리본용</h3>
            <p class="prompt-pad-text">다음 글을 정리본으로 만들어줘. 너가 스스로 글을 쓰진 말고, 글의 내용을 기반으로만 정리해. 논리적 흐름(문제→원인→전환→근거→실천)으로 재구성하고, 서술형 문장으로 읽기 쉽게. 마지막에 한 문장 요약 포함.</p>
            <button class="btn btn-sm btn-quiet prompt-pad-copy" type="button" data-copy="정리본">복사</button>
          </div>
        </div>
      </section>

      <div id="list">
        <div class="skeleton">
          <div class="skeleton-bar" style="width: 45%"></div>
          <div class="skeleton-bar" style="width: 85%"></div>
        </div>
        <div class="skeleton">
          <div class="skeleton-bar" style="width: 35%"></div>
          <div class="skeleton-bar" style="width: 70%"></div>
        </div>
      </div>
    </main>

    <script src="config.js"></script>
    <script src="js/store.js"></script>
    <script src="js/markdown.js"></script>
    <script src="js/folders.js"></script>
    <script src="js/docs.js"></script>
    <script src="js/github.js"></script>
    <script src="js/app.js"></script>
    <script src="js/home.js"></script>
  </body>
</html>
